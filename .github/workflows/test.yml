name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - 'tests/**'
      - 'app/**'
      - 'webui/**'
      - 'packaging/docker/**'
      - 'bin/**'
      - '.github/workflows/test.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Linux PowerShell (Pester)
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/powershell:7.5-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install scheduler timezone data
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
      - name: Run Docker backend tests
        shell: pwsh
        run: |
          ./tests/Run-DockerTests.ps1 -CI
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-pester-results
          path: tests/TestResults.xml
          if-no-files-found: error

  python:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Docker manager (Python)
    runs-on: ubuntu-24.04
    container: python:3.13-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dune
          POSTGRES_USER: dune
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U dune -d dune"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DST_TEST_POSTGRES_HOST: postgres
      DST_TEST_POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - name: Install manager test dependencies
        run: |
          command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git)
          python -m pip install 'PyYAML==6.0.3' 'psycopg[binary]==3.3.8'
      - name: Run native Docker manager and transport tests
        working-directory: packaging/docker
        run: python -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify map assets and item coverage
        run: |
          python -B -m unittest discover -s tests -p test_atlas_builds.py -v
          python -B -m unittest discover -s tools/atlas -p test_live.py -v
          python -B -m unittest discover -s tools/atlas -p test_assets.py -v
          python -B -m unittest discover -s tools/atlas -p test_elf.py -v
          python -B -m unittest discover -s tests -p test_item_catalog_coverage.py -v

  vitest:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: WebUI (Vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        working-directory: webui
        run: npm ci
      - name: Build Docker UI
        working-directory: webui
        env:
          VITE_DST_EDITION: docker
        run: npm run build
      - name: Run WebUI tests
        working-directory: webui
        run: npm test

  platform-helper:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Linux platform cache helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and self-test the packaged Linux helper
        run: |
          dotnet publish app/tools/DunePlatformStore/DunePlatformStore.Linux.csproj -c Release -o "$RUNNER_TEMP/dst-platform"
          "$RUNNER_TEMP/dst-platform/DunePlatformStore" --command self-test
